services:

  database:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    image: app_backend
    build:
      context: app/backend/
      dockerfile: Dockerfile
    env_file: app/backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://database:27017/app
    volumes:
      - ./app/backend/uploads:/app/backend/uploads
    depends_on:
      seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  frontend:
    build:
      context: app/frontend/
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped

  seeder:
      image: app_backend 
      command: npm run seed  
      env_file: app/backend/.env
      environment:
        - MONGO_URI=mongodb://database:27017/app
      depends_on:
        database:
          condition: service_healthy


  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mongo_data:
